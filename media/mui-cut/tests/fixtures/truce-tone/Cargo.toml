# A truce plugin mui-cut's adapter builds and plays (tests/sound.rs): a
# sine at its Pitch while a note is held, its Level loud. Its Cargo.lock
# must never change.
[package]
name = "fixture-truce-tone"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
truce = { version = "6.3", default-features = false }
mui = { git = "https://github.com/Matari-Audio/MUI" }
mui-truce = { git = "https://github.com/Matari-Audio/MUI" }

[workspace]

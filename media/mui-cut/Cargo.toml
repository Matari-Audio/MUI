[package]
name = "mui-cut"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "A small keyframe motion editor on MUI: a plain-text *.cut.json project, a pure evaluator, a headless render CLI and a WASM web editor."

# The library (document, evaluator, MUI/Vello CPU renderer) builds for
# wasm32-unknown-unknown; the CLI and its local server are native only.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mui-cut"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The project's JSON Schema (`mui-cut schema`), from the types themselves.
schemars = "1"
# Load errors name the JSON path that failed (`scenes[0].layers[2].x`).
serde_path_to_error = "0.1"
mui-scene = { path = "../../crates/mui-scene" }
mui-vello = { workspace = true, features = ["cpu", "gpu-effects"] }
pollster.workspace = true
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline", "text"] }
# The ImageId mui-vello's brushes carry.
vello_common = { version = "0.2", default-features = false, features = ["std"] }
# Vello's sparse-strips GPU renderer (ex `vello_hybrid`), the `gpu` engine.
# Git main: crates.io still has it as `vello_hybrid` on wgpu 29. It brings a
# second, git `vello_common`; mui-vello stays on the crates.io one (patching
# it to git breaks mui-vello), and kurbo/peniko are shared, so only brushes
# and image ids cross over (src/sparse.rs).
vello_gpu = { git = "https://github.com/linebender/vello", rev = "9dfe53e9d7c42ceaa169eec99b611920b270e6c3", default-features = false, features = ["wgpu", "text"] }
glifo = { git = "https://github.com/linebender/vello", rev = "9dfe53e9d7c42ceaa169eec99b611920b270e6c3", default-features = false, features = ["std"] }
png.workspace = true
ttf-inter = { version = "0.1", default-features = false, features = ["v"] }
mui-text.workspace = true
mui-geometry.workspace = true
# Seeded gradient noise for the noise deformer: pure Rust, same on wasm.
noise = { version = "0.9", default-features = false }
# SVG and Lottie import through their backend-agnostic `RenderSink`s (no vello
# feature): shapes come out as kurbo paths and draw through MUI like the rest.
vello_svg = { version = "0.11", default-features = false }
velato = { version = "0.12", default-features = false }
# 3D scenes: layers on lit slabs with shadows, models, on the same device
# (the GPU engines pick wgpu's backends).
mui-stage = { path = "../mui-stage", default-features = false }
# Model layers: glTF binaries, meshes and their PBR and glass materials.
gltf = { version = "1.4", default-features = false, features = ["utils", "extensions", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_volume"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }
# WebGL2 for browsers without WebGPU, drawn by vello_gpu.
wgpu = { workspace = true, features = ["webgpu", "webgl", "wgsl"] }

# Sub-frame shutter averaging comes from mui-reel.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mui-reel = { path = "../mui-reel" }
# A still or a preview frame rasterises on several threads; export runs
# several frames at once instead (src/pool.rs).
vello_cpu = { version = "0.2", default-features = false, features = ["multithreading"] }
# `mui-cut gen`: sandboxed, deterministic scripts that write projects. No
# clock, no modules: a script's output depends on its text alone.
# Plugin captures arrive as base64 PNGs over the bridge's wire.
base64 = "0.22"
rhai = { version = "1.26", features = ["serde", "no_time", "no_module"] }
wgpu = { workspace = true, features = ["default"] }
# `mui-cut midi`: Standard MIDI Files into a plugin layer's notes.
midly = { version = "0.5", default-features = false, features = ["std"] }
# `serve` plays the project's sound live (a null clock when there is no device).
cpal = "0.17"
# `serve` removes its discovery file when Ctrl+C or SIGTERM ends it.
ctrlc = { version = "3.4", features = ["termination"] }

[dev-dependencies]
# `examples/synth.rs`: a small plugin editor behind the bridge's live
# protocol, for the plugin layer's example and tests.
mui.workspace = true
mui-motion-bridge = { path = "../mui-motion-bridge" }
# Checks the generated schema accepts the examples (no network resolving).
jsonschema = { version = "0.58", default-features = false }
# The effects' WGSL, checked for WebGL2's uniform layout rules.
naga = { version = "30", features = ["wgsl-in"] }
serde_json.workspace = true
png.workspace = true

[lints]
workspace = true

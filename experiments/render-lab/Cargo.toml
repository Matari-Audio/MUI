[package]
name = "mui-render-lab"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
mui = { path = "../../crates/mui", features = ["text"] }
vello = "=0.10.0"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
x11rb = "0.13"
gpui = { path = "../upstream/crates/gpui", default-features = false }
gpui_wgpu = { path = "../upstream/crates/gpui_wgpu" }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }

[profile.release.package.image]
codegen-units = 1

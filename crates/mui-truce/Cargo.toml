[package]
name = "mui-truce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mui = { workspace = true, features = ["gpu-effects"] }
truce-core = "6.3"
truce-params = "6.3"

# The native editor: a baseview child window under the host's parent, a wgpu
# surface on it. None of it builds for wasm, and the parameter bridge needs
# none of it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
baseview = { package = "baseview-truce", version = "0.1.1-truce.13" }
# Only `platform`: truce's parent handle and macOS view anchoring.
truce-gui = { version = "6.3", default-features = false }
keyboard-types = { version = "0.7", default-features = false }
# baseview's parent handle is raw-window-handle 0.5.
raw-window-handle = "0.5"
pollster.workspace = true
# mui-vello picks no backend; the window that owns the device does.
wgpu = { workspace = true, features = ["wgsl", "vulkan", "gles", "metal", "dx12"] }

# baseview does not own an X11 selection; arboard keeps one alive.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false }

[dev-dependencies]
truce.workspace = true

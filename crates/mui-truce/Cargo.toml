[package]
name = "mui-truce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mui = { workspace = true, features = ["gpu-effects"] }
truce-core = "6.3"
truce-params = "6.3"

# The native editor: mui-baseview's window under the host's parent. None of
# it builds for wasm, and the parameter bridge needs none of it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mui-baseview.workspace = true
# truce's parent handle as the raw-window-handle 0.6 baseview takes; baseview
# itself comes through `mui_baseview::baseview`.
raw-window-handle = "0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
keyboard-types = { version = "0.8", default-features = false }

[dev-dependencies]
truce.workspace = true

[lints]
workspace = true

[package]
name = "mui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
egui = ["dep:mui-egui"]
cpu = ["mui-vello/cpu"]

[dependencies]
mui-core = { path = "../mui-core" }
mui-layout = { path = "../mui-layout" }
mui-geometry = { path = "../mui-geometry" }
mui-tessellate = { path = "../mui-tessellate" }
mui-input = { path = "../mui-input" }
mui-vello = { path = "../mui-vello" }
mui-egui = { path = "../mui-egui", optional = true }

[dev-dependencies]
epaint_default_fonts = "0.36"
png = "0.17"

[[example]]
name = "snapshot"
required-features = ["cpu"]

[package]
name = "mui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
gpu-effects = ["mui-vello/gpu-effects"]
cpu = ["mui-vello/cpu"]
cpu-threads = ["mui-vello/cpu-threads"]

[dependencies]
mui-scene.workspace = true
mui-motion.workspace = true
mui-layout.workspace = true
mui-geometry.workspace = true
mui-input.workspace = true
mui-text.workspace = true
mui-vello.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
epaint_default_fonts.workspace = true
png.workspace = true
libc = "0.2"

[[example]]
name = "snapshot"
required-features = ["cpu"]

[[example]]
name = "motion_strip"
required-features = ["cpu"]
# The scale contract is asserted where it is demonstrated, so the example and
# the test cannot drift apart.
test = true

[lints]
workspace = true

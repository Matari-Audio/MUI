[package]
name = "mui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gpu-effects = ["mui-vello/gpu-effects"]
cpu = ["mui-vello/cpu"]
cpu-threads = ["mui-vello/cpu-threads"]

[dependencies]
mui-scene = { path = "../mui-scene" }
mui-motion = { path = "../mui-motion" }
mui-layout = { path = "../mui-layout" }
mui-geometry = { path = "../mui-geometry" }
mui-input = { path = "../mui-input" }
mui-text = { path = "../mui-text" }
mui-vello = { path = "../mui-vello" }
unicode-segmentation = "1.12"

[dev-dependencies]
epaint_default_fonts = "0.36"
png = "0.17"
libc = "0.2"

[[example]]
name = "snapshot"
required-features = ["cpu"]

[[example]]
name = "motion_strip"
required-features = ["cpu"]
# The scale contract is asserted where it is demonstrated, so the example and
# the test cannot drift apart.
test = true

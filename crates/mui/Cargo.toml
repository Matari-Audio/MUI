[package]
name = "mui"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[features]
default = []
# Opt-in native integration-fixture hooks, omitted from shipping builds.
test-support = ["mui-vello/test-support"]
reporting = ["mui-vello/reporting"]
gpu-quad = ["mui-vello/gpu-quad"]
cpu = ["mui-vello/cpu"]
cpu-threads = ["mui-vello/cpu-threads"]
software-window = ["mui-vello/software-window"]
# Bundle Material Symbols as the default `icon(..)` face: Rounded (~15 MB,
# the default look) or Outlined (~11 MB). `icons` is Rounded. A theme's
# `icon_font` still wins; see mui-symbols' docs to ship a subset instead.
icons = ["icons-rounded"]
icons-rounded = ["mui-scene/symbols-rounded"]
icons-outlined = ["mui-scene/symbols-outlined"]

[dependencies]
color.workspace = true
mui-scene.workspace = true
mui-material.workspace = true
mui-motion.workspace = true
mui-layout.workspace = true
mui-geometry.workspace = true
mui-input.workspace = true
rustc-hash.workspace = true
mui-text.workspace = true
mui-vello = { path = "../mui-vello" }
unicode-segmentation.workspace = true

[dev-dependencies]
epaint_default_fonts.workspace = true
png.workspace = true
ttf-inter.workspace = true
libc = "0.2"

[[example]]
name = "snapshot"
required-features = ["cpu"]

[[example]]
name = "motion_strip"
required-features = ["cpu"]
# The scale contract is asserted where it is demonstrated, so the example and
# the test cannot drift apart.
test = true

[[example]]
name = "large_lists"
required-features = ["cpu"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
dbg_macro = "deny"
todo = "deny"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
unnested_or_patterns = "warn"
default_trait_access = "warn"
uninlined_format_args = "warn"
single_match_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
if_not_else = "warn"
items_after_statements = "warn"
unreadable_literal = "allow"

[[example]]
name = "semantic_gallery"
required-features = ["cpu"]

[package]
name = "mui-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A styled element tree lowered to a resolved, paint-ordered scene: MUI's El DSL, theme resolution and scene walk."

[dependencies]
mui-weld = { path = "../mui-weld" }
mui-geometry = { path = "../mui-geometry" }
mui-style = { path = "../mui-style" }
mui-motion = { path = "../mui-motion" }
mui-layout = { path = "../mui-layout" }
mui-text = { path = "../mui-text" }

[dev-dependencies]
epaint_default_fonts = "0.36"
ttf-inter = { version = "0.1", default-features = false, features = ["v"] }

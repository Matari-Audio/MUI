[package]
name = "mui-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A styled element tree lowered to a resolved, paint-ordered scene: MUI's El DSL, theme resolution and scene walk."

[features]
# Embed Material Symbols Rounded / Outlined (mui-symbols' `font-*`) and draw
# `icon(..)` in it when the theme sets no `icon_font`. Rounded wins if both.
symbols-rounded = ["mui-symbols/font-rounded"]
symbols-outlined = ["mui-symbols/font-outlined"]

[dependencies]
mui-weld.workspace = true
mui-geometry.workspace = true
mui-style.workspace = true
mui-motion.workspace = true
mui-layout.workspace = true
mui-text.workspace = true
# `sym`, in the prelude for `icon(sym::HOME)`.
mui-symbols.workspace = true
rustc-hash.workspace = true
smallvec = "1.16"

[dev-dependencies]
mui-material.workspace = true
epaint_default_fonts.workspace = true
ttf-inter.workspace = true

[lints]
workspace = true

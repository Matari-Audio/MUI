[package]
name = "mui-scene"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A styled element tree lowered to a resolved, paint-ordered scene: MUI's El DSL, theme resolution and scene walk."

[features]
# Embed Material Symbols Rounded / Outlined (mui-symbols' `font-*`) and draw
# `icon(..)` in it when the theme sets no `icon_font`. Rounded wins if both.
symbols-rounded = ["mui-symbols/font-rounded"]
symbols-outlined = ["mui-symbols/font-outlined"]

[dependencies]
mui-weld.workspace = true
mui-geometry.workspace = true
mui-style.workspace = true
mui-motion.workspace = true
mui-layout.workspace = true
mui-text.workspace = true
# `sym`, in the prelude for `icon(sym::HOME)`.
mui-symbols.workspace = true
rustc-hash.workspace = true
smallvec = "1.16"

[dev-dependencies]
mui-material.workspace = true
epaint_default_fonts.workspace = true
ttf-inter.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
dbg_macro = "deny"
todo = "deny"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
unnested_or_patterns = "warn"
default_trait_access = "warn"
uninlined_format_args = "warn"
single_match_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
if_not_else = "warn"
items_after_statements = "warn"
unreadable_literal = "allow"

[package]
name = "mui-baseview"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"

# A native window: nothing here builds for wasm.
[features]
# Native integration-fixture event queue; never enabled by ordinary builds.
test-support = ["mui/test-support"]
# Explicitly accepts that a plugin panic can terminate its DAW.
allow-panic-abort = []

[dependencies]
matari-audio-drag-and-drop = { git = "https://github.com/Matari-Audio/matari-audio-drag-and-drop", rev = "cdf658f67ba5a17b7370dd0577a347ab41a88978" }
mui = { path = "../mui", features = ["gpu-quad", "software-window"] }
mui-present.workspace = true
baseview = { package = "moose-baseview", path = "../../vendor/moose-baseview" }
mui-access.workspace = true
keyboard-types = { version = "0.8", default-features = false }
# baseview's handles; the same 0.6 wgpu takes.
raw-window-handle = { version = "0.6", features = ["std"] }
# The GPU HAL: native Vulkan on Linux, so Linux plugins link no wgpu.
mui-hal.workspace = true

# Frame visibility, coordinates, and window effects.
# Until mui-hal's Metal and D3D11 backends land, macOS and Windows windows
# present through wgpu. Native primary APIs only: GLES is unreachable in
# GpuInit.
[target.'cfg(not(target_os = "linux"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "metal", "static-dxc", "std", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Frosted windows (`frost`) and window levels (`sticky`).
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSGraphics", "NSResponder", "NSScreen", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSGeometry"] }
accesskit_macos = { path = "../../vendor/accesskit_macos" }

# baseview does not own an X11 selection; arboard keeps one alive.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false }
# AT-SPI; screen bounds borrow baseview's original X11 connection below.
accesskit_unix = { path = "../../vendor/accesskit_unix" }
x11-dl = "2.21"
# Hyprland lists its clients as JSON (`frost`).
serde_json = "1"
x11rb = { version = "0.13.2", default-features = false, features = ["allow-unsafe-code", "dl-libxcb"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "0.34"
# Frosted windows (`frost`) and topmost (`sticky`).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
dbg_macro = "deny"
todo = "deny"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
unnested_or_patterns = "warn"
default_trait_access = "warn"
uninlined_format_args = "warn"
single_match_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
if_not_else = "warn"
items_after_statements = "warn"
unreadable_literal = "allow"

[dev-dependencies]
png.workspace = true
epaint_default_fonts.workspace = true

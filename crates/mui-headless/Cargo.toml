[package]
name = "mui-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless agent tooling for MUI editors: snap, tree, script, trace on a fixed virtual clock, CPU renderer, no window and no GPU."

# A plugin opts in (a dev-dependency or an `examples/` binary); nothing here
# links a window system or wgpu. The CPU rasteriser is the only renderer.
[dependencies]
mui = { workspace = true, features = ["cpu"] }
png.workspace = true
serde_json = "1"

[dev-dependencies]
epaint_default_fonts.workspace = true

[lints]
workspace = true

[package]
name = "mui-headless"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Headless agent tooling for MUI editors: snap, tree, script, trace on a fixed virtual clock, CPU renderer, no window and no GPU."

# A plugin opts in (a dev-dependency or an `examples/` binary); nothing here
# links a window system or wgpu. The CPU rasteriser is the only renderer.
[dependencies]
mui = { path = "../mui", features = ["cpu"] }
png.workspace = true
serde_json = "1"

[dev-dependencies]
epaint_default_fonts.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
dbg_macro = "deny"
todo = "deny"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
unnested_or_patterns = "warn"
default_trait_access = "warn"
uninlined_format_args = "warn"
single_match_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
if_not_else = "warn"
items_after_statements = "warn"
unreadable_literal = "allow"

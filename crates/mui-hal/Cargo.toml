[package]
name = "mui-hal"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "MUI's owned render-only GPU HAL: Vulkan (ash), Metal (objc2-metal), D3D11 (windows), with an opt-in wgpu passthrough"

[features]
default = []
# Passthrough backend for web/wasm, media and wgpu-sharing plugins, and interim
# default on macOS/Windows while native Metal and D3D11 OS-CI parity is pending.
wgpu = ["dep:wgpu"]
# Open every device through wgpu, never natively: for a plugin that shares
# the renderer's device with its own wgpu work (e.g. compute). Per build,
# unlike MUI_HAL_BACKEND, so other plugins in the same process keep Vulkan.
wgpu-only = ["wgpu"]

[dependencies]
bitflags = "2"
mui-shaders.workspace = true
raw-window-handle = "0.6"
wgpu = { version = "30", default-features = false, features = ["static-dxc", "std", "wgsl"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
mui-present.workspace = true

# The passthrough's native backend per target, so `wgpu` alone works
# (Linux users of it enable `vulkan` themselves; plugins there never do).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSResponder", "NSView", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSError", "NSGeometry", "NSObject", "NSRange", "NSString"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLCounters",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
    "MTLVertexDescriptor",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "CALayer",
    "CAMetalLayer",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-metal",
] }
wgpu = { version = "30", default-features = false, features = ["metal", "static-dxc", "std"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
mui-present.workspace = true
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
wgpu = { version = "30", default-features = false, features = ["dx12", "static-dxc", "std"], optional = true }

[dev-dependencies]
pollster.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }

# AppKit views must be made on the main thread, which libtest's are not.
[[test]]
name = "native_surface"
harness = false

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
wgpu = { version = "30", default-features = false, features = ["static-dxc", "std", "vulkan", "wgsl"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
dbg_macro = "deny"
todo = "deny"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
unnested_or_patterns = "warn"
default_trait_access = "warn"
uninlined_format_args = "warn"
single_match_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
if_not_else = "warn"
items_after_statements = "warn"
unreadable_literal = "allow"

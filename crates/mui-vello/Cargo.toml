[package]
name = "mui-vello"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# A CPU rasteriser: snapshot tests, thumbnails, hosts with no GPU.
cpu = ["dep:vello_cpu"]
# Compile classic vello into `examples/bench.rs` so the comparison has a third
# column. Off by default: it drags in the whole compute pipeline for a number.
bench-classic = []

[dependencies]
mui-core = { path = "../mui-core" }
mui-geometry = { path = "../mui-geometry" }
# No wgpu backend features: a plugin renders into the device its host wrapper
# already created, so this crate must not choose the backend. Hosts turn on
# `wgpu_default` (desktop) or `webgl` (browser) themselves.
vello_hybrid = { version = "0.2", default-features = false, features = ["wgpu", "text"] }
# `Glyph` is the one glyph type neither renderer re-exports, so it comes
# straight from the crate both of them already build on.
glifo = { version = "0.3", default-features = false }
# kurbo and peniko reach us through vello_common so the types cannot version-skew.
vello_common = { version = "0.2", default-features = false }
# Types only (`Device`, `Queue`) for the image atlas upload; still no backend.
wgpu = { version = "29", default-features = false }
vello_cpu = { version = "0.2", optional = true, default-features = false, features = ["std", "u8_pipeline", "text"] }

[dev-dependencies]
mui-layout = { path = "../mui-layout" }
epaint_default_fonts = "0.36"
mui-text = { path = "../mui-text" }
png = "0.17"
# The example builds its own headless device.
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan", "gles", "metal", "dx12"] }
pollster = "0.4"
vello_hybrid = { version = "0.2", features = ["wgpu_default"] }
mui = { path = "../mui" }
# Classic vello, for `--features bench-classic`. `bump_estimate` is the only
# way either renderer will tell us what it asks the GPU for.
vello = { version = "0.10", default-features = false, features = ["wgpu", "bump_estimate"] }

[[example]]
name = "bench"
required-features = ["cpu"]

[package]
name = "mui-vello"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Hidden integration-fixture hooks; absent from ordinary shipping builds.
test-support = []
reporting = ["dep:baseview", "dep:serde_json", "dep:sha2", "dep:ureq", "dep:hickory-resolver", "dep:tokio"]
# The GPU renderer (`effects::GpuRenderer`, `host`): the instanced SDF quad
# pass, with no compute shaders and no storage buffers. `vello_cpu` rasterises
# glyph masks for its atlas and the frames the pass refuses.
gpu-quad = ["cpu", "dep:pollster", "dep:mui-shaders"]
# Also open devices through wgpu (`mui-hal`'s passthrough): media, BUFFR and
# the web, which share the device with their own wgpu work.
wgpu = ["mui-hal/wgpu"]
# A CPU rasteriser: snapshot tests, thumbnails, hosts with no GPU.
cpu = ["dep:vello_cpu", "dep:glifo"]
# Rasterise on a rayon pool instead of one core. Off by default: a snapshot-
# sized pixmap loses more to thread hand-off than it gains.
cpu-threads = ["cpu", "vello_cpu/multithreading"]
# Native CPU presentation, independent of GPU drivers (owned `mui-present`).
software-window = ["cpu", "dep:raw-window-handle"]

[dependencies]
mui-present.workspace = true
mui-shaders = { workspace = true, optional = true }
raw-window-handle = { version = "0.6", optional = true }
mui-scene.workspace = true
mui-weld.workspace = true
mui-geometry.workspace = true
rustc-hash.workspace = true
# `host` opens and, after a loss, reopens a device from a frame callback.
pollster = { workspace = true, optional = true }
# `Glyph` is the one glyph type `vello_cpu` does not re-export, so it comes
# straight from the crate it builds on.
glifo = { version = "0.4", path = "../../vendor/glifo", default-features = false, optional = true }
# kurbo and peniko reach us through vello_common so the types cannot version-skew.
vello_common = { version = "0.3", default-features = false, features = ["std"] }
# The GPU HAL: native Vulkan on Linux, wgpu (feature `wgpu`) elsewhere.
mui-hal.workspace = true
vello_cpu = { workspace = true, optional = true }

[dev-dependencies]
mui-layout.workspace = true
mui-material.workspace = true
epaint_default_fonts.workspace = true
mui-text.workspace = true
ttf-inter.workspace = true
png.workspace = true
pollster.workspace = true
mui.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A/B runs through the wgpu passthrough (`--features wgpu`, MUI_HAL_BACKEND=wgpu)
# need a wgpu backend to open.
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Pin only: safe nonblocking report cancellation requires keeping this native
# image mapped if a network operation outlives the last editor. Never used on WASM.
baseview = { package = "moose-baseview", path = "../../vendor/moose-baseview", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["system-config", "tokio"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"], optional = true }
# The joined resolver uses ureq's explicitly unversioned low-level API.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }

[[example]]
name = "gpu_contract"
required-features = ["gpu-quad"]

[[example]]
name = "headless"
required-features = ["gpu-quad"]

[[example]]
name = "bench"
required-features = ["gpu-quad"]

[[example]]
name = "quad_coverage"
required-features = ["gpu-quad"]

[[example]]
name = "quad_bench"
required-features = ["gpu-quad"]

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser wasm is single-threaded: wgpu's handles are Send/Sync there only with
# this feature. The shared GPU session needs it to compile; spawning its
# initializer fails on wasm and the caller takes the recorded failure path.
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }
mui-hal = { workspace = true, features = ["wgpu"] }

[target.'cfg(not(any(target_os = "linux", target_arch = "wasm32")))'.dependencies]
# No native backend here yet (Metal and D3D11 are to come): wgpu covers it.
mui-hal = { workspace = true, features = ["wgpu"] }

[target.'cfg(all(windows, not(target_arch = "aarch64"), target_env = "msvc"))'.dependencies]
# Not used directly: pins wgpu's static-dxc backend for every downstream lock.
# 0.1.6's build script refuses its own (mutable) GitHub release and 0.1.5 is
# yanked, so a fresh resolve breaks every Windows build. Unpin once upstream
# publishes an immutable release.
mach-dxcompiler-rs = { version = "=0.1.4", default-features = false }

[[example]]
name = "gpu_pixels"
required-features = ["gpu-quad"]

[package]
name = "mui-winit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
external-xdnd = ["winit/external-xdnd"]

[dependencies]
# Reuse the plugin-image pin rather than duplicating loader FFI.
baseview = { package = "moose-baseview", path = "../../vendor/moose-baseview", default-features = false }
mui = { workspace = true, features = ["gpu-effects", "software-window"] }
mui-access.workspace = true
wgpu = { workspace = true, features = ["default"] }
winit = "0.30"
accesskit_winit = { path = "../../vendor/accesskit_winit" }
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
epaint_default_fonts.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", default-features = false }

[[example]]
name = "external_xdnd"
required-features = ["external-xdnd"]

[lints]
workspace = true

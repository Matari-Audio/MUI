[package]
name = "mui-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# The CPU rasteriser, for the snapshot test. The gallery itself is a GPU
# host and never uses it.
cpu = ["mui/cpu"]

[dependencies]
mui = { path = "../mui", features = ["gpu-effects"] }
mui-text = { path = "../mui-text" }
# The gallery owns the window and the device, which is exactly the split a
# plugin wrapper has. The library crates above pick no backend of their own.
wgpu = "30"
winit = "0.30"
pollster = "0.4"
# Fallback face so the glyph scene has something to draw without a system font.
# Zero dependencies of its own -- no egui reaches the graph through it.
epaint_default_fonts = "0.36"
mui-access = { path = "../mui-access" }
accesskit_winit = "0.33"

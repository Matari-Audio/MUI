[package]
name = "mui-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# The CPU rasteriser, for the snapshot test. The gallery itself is a GPU
# host and never uses it.
cpu = ["mui/cpu"]

[dependencies]
mui = { workspace = true, features = ["gpu-quad"] }
mui-text.workspace = true
mui-baseview.workspace = true
# Fallback face so the glyph scene has something to draw without a system font.
# Zero dependencies of its own -- no egui reaches the graph through it.
epaint_default_fonts.workspace = true
mui-access.workspace = true
mui-headless.workspace = true
serde_json = "1"

[dev-dependencies]
wgpu.workspace = true
pollster.workspace = true

[lints]
workspace = true

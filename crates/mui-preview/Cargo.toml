[package]
name = "mui-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
mui = { path = "../mui" }
mui-text = { path = "../mui-text" }
# The gallery owns the window and the device, which is exactly the split a
# plugin wrapper has. The library crates above pick no backend of their own.
vello_common = { version = "0.2", default-features = false }
vello_hybrid = { version = "0.2", features = ["wgpu_default"] }
# No feature list here: `vello_hybrid/wgpu_default` turns on `wgpu/default`,
# which already carries every backend, so naming them looks like a policy the
# build does not actually honour. Pick backends by dropping `wgpu_default`.
wgpu = "29"
winit = "0.30"
pollster = "0.4"
# Fallback face so the glyph scene has something to draw without a system font.
# Zero dependencies of its own -- no egui reaches the graph through it.
epaint_default_fonts = "0.36"
mui-access = { path = "../mui-access" }
accesskit_winit = "0.33"

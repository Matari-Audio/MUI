[package]
name = "mui-present"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Owned native presentation layer for MUI (Win32 DIB WM_PAINT, macOS IOSurface/CALayer, Linux VkSwapchain/X11 MIT-SHM/Wayland wl_shm)"

[dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"] }
libc = "0.2"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb = { version = "0.13.2", default-features = false, features = ["shm"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSResponder", "NSView", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFBase", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSObject"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "CATransaction", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
dbg_macro = "deny"
todo = "deny"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
unnested_or_patterns = "warn"
default_trait_access = "warn"
uninlined_format_args = "warn"
single_match_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
if_not_else = "warn"
items_after_statements = "warn"
unreadable_literal = "allow"

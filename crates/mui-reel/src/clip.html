<!doctype html>
<!-- Generated by mui-reel. A HyperFrames sub-composition: host it with
     data-composition-id="mui-reel" data-composition-src="<dir>/clip.html". -->
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #mui-reel-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #mui-reel-take {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: contain;
        }
      </style>
      <div id="mui-reel-root" data-composition-id="mui-reel" data-start="0" data-width="{W}" data-height="{H}" data-duration="{DURATION}">
        <video id="mui-reel-take" class="clip" src="take.mp4" data-start="0" data-duration="{DURATION}" data-track-index="0" muted playsinline></video>
        {AUDIO}
      </div>
      <script>
        {TRACK_JS}
        window.MUI_TRACK = MuiTrack.load({TRACK});
        window.__timelines["mui-reel"] = gsap.timeline({ paused: true });
      </script>
    </template>
  </body>
</html>

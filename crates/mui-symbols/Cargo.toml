[package]
name = "mui-symbols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Material Symbols codepoints: generated char consts and a name lookup."

[lints]
workspace = true

[features]
# The full upstream Material Symbols variable fonts, as `font::ROUNDED` /
# `font::OUTLINED` (about 15 and 11 MB). `font` is Rounded, the default look.
font = ["font-rounded"]
font-rounded = []
font-outlined = []

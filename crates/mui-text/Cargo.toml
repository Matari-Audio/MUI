[package]
name = "mui-text"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[features]
default = []
# Discovery is explicit and intended for startup/UI work, never an audio callback.
system-fonts = ["dep:fontdb"]

[dependencies]
mui-geometry.workspace = true
smallvec = { version = "1.16", features = ["const_new", "union"] }
fontdb = { version = "0.23", optional = true, default-features = false, features = ["std", "fs", "fontconfig"] }
# Bump these two together: skrifa 0.46 and harfrust 0.13 share read-fonts
# 0.43, so one parse serves both outlines and shaping. glifo 0.4/vello pin skrifa
# 0.44 (read-fonts 0.41): one copy once glifo ships on skrifa 0.46, or 0.47 once
# a harfrust past 0.13.3 moves to read-fonts 0.44.
skrifa = "0.46"
harfrust = "0.13"
unicode-bidi = "0.3"
unicode-linebreak = "0.1.5"
unicode-segmentation.workspace = true

[dev-dependencies]
# Font bytes for deterministic tests; default builds require only supplied bytes.
epaint_default_fonts.workspace = true
ttf-inter.workspace = true

[[example]]
name = "system_fonts"
required-features = ["system-fonts"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
dbg_macro = "deny"
todo = "deny"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
unnested_or_patterns = "warn"
default_trait_access = "warn"
uninlined_format_args = "warn"
single_match_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
if_not_else = "warn"
items_after_statements = "warn"
unreadable_literal = "allow"

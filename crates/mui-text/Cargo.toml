[package]
name = "mui-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Discovery is explicit and intended for startup/UI work, never an audio callback.
system-fonts = ["dep:fontdb"]

[dependencies]
mui-geometry.workspace = true
fontdb = { version = "0.23", optional = true, default-features = false, features = ["std", "fs", "fontconfig"] }
# Bump these two together: skrifa 0.46 and harfrust 0.13 share read-fonts
# 0.43, so one parse serves both outlines and shaping. glifo 0.3/vello pin skrifa
# 0.44 (read-fonts 0.41): one copy once glifo ships on skrifa 0.46, or 0.47 once
# a harfrust past 0.13.3 moves to read-fonts 0.44.
skrifa = "0.46"
harfrust = "0.13"
unicode-bidi = "0.3"
unicode-linebreak = "0.1.5"
unicode-segmentation.workspace = true

[dev-dependencies]
# Font bytes for deterministic tests; default builds require only supplied bytes.
epaint_default_fonts.workspace = true
ttf-inter.workspace = true

[[example]]
name = "system_fonts"
required-features = ["system-fonts"]

[lints]
workspace = true

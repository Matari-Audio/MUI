[package]
name = "mui-style"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Theme data for MUI: Oklch colours, palettes, roles, fills, gradients, shadows and the Style a node paints by."

[dependencies]
# Shared vector primitives; the renderer uses the same version via vello_common.
kurbo = "0.13.1"
peniko = "0.6.1"
# The renderer reaches us through the same crate, so colour types cannot
# version-skew with what vello paints. No transitive dependencies of its own.
color.workspace = true
# Only for CornerStyle.
mui-geometry.workspace = true
# Only for the spacing vocabulary a shell's thickness is stated in; the
# solver does not depend on style, so no cycle.
mui-layout.workspace = true
# Only for the theme's icon font.
mui-text.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
dbg_macro = "deny"
todo = "deny"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
unnested_or_patterns = "warn"
default_trait_access = "warn"
uninlined_format_args = "warn"
single_match_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
if_not_else = "warn"
items_after_statements = "warn"
unreadable_literal = "allow"

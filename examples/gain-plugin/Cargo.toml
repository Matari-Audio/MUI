[package]
name = "mui-gain-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# truce exports the CLAP and VST3 entry points from the cdylib.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["clap", "vst3"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]

[dependencies]
truce.workspace = true
truce-clap = { version = "6.3", optional = true }
truce-vst3 = { version = "6.3", optional = true }
clap-sys = { version = "0.5", optional = true }
mui.workspace = true
mui-truce.workspace = true
epaint_default_fonts.workspace = true

[package]
name = "mui-renderer-bench"
version = "0.1.0"
edition = "2024"
publish = false

# Keep experimental engines out of MUI's production dependency graph.
[workspace]

[features]
gpui = ["dep:gpui", "dep:gpui_wgpu"]

[dependencies]
anyhow = "1"
pollster = "0.4"
serde_json = "1"
png = "0.18"
libc = "0.2"
wgpu = "30"
classic = { package = "vello", path = "../../vendor/vello" }
vello_cpu = { git = "https://github.com/linebender/vello", rev = "96d4643cca622259acad44e9e715e3e3fac3c09f" }
vello_gpu = { git = "https://github.com/linebender/vello", rev = "96d4643cca622259acad44e9e715e3e3fac3c09f", features = ["wgpu"] }
skia-safe = "=0.153.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "f1a10a5227a331e86bdb006301e1090a21d33e7a", default-features = false, features = ["bench-support"], optional = true }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "f1a10a5227a331e86bdb006301e1090a21d33e7a", default-features = false, features = ["bench-support"], optional = true }

[profile.release]
opt-level = 3
debug = 1

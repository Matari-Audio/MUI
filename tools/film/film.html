<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MUI / Native performance</title><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>
@font-face{font-family:Inter;src:url('assets/Inter-V.otf') format('opentype');font-weight:100 900}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}#film{position:relative;width:100%;height:100%;font-family:Inter,sans-serif;background:#eeeae2;color:#202320}.brand{position:absolute;left:72px;top:52px;font-size:24px;font-weight:600}.tag{position:absolute;right:72px;top:54px;font-size:21px;color:#53574e}h1{position:absolute;left:72px;top:174px;font-size:88px;line-height:1.1;letter-spacing:-.03em;margin:0;max-width:460px}#notes{position:absolute;left:78px;top:400px;font-size:58px;color:#a53d23;font-weight:650;max-width:450px}#caption{position:absolute;left:78px;top:575px;font-size:24px;line-height:1.5;width:390px}#stage{position:absolute;left:430px;right:45px;top:104px;height:670px;perspective:2200px}.rig{position:absolute;left:0;top:0;transform-style:preserve-3d}#scope{position:absolute;left:72px;top:844px;width:1776px;height:150px;background:#202320;border-radius:6px}.scope-label{position:absolute;left:72px;top:805px;font-size:20px;color:#53574e}#time{position:absolute;right:72px;top:805px;font-size:20px;font-variant-numeric:tabular-nums;color:#53574e}.line{position:absolute;left:72px;right:72px;bottom:44px;border-top:1px solid #c3c3b6}
</style></head><body><div id="film" data-composition-id="mui-performance" data-start="0" data-duration="__DURATION__" data-width="1920" data-height="1080">
<div class="brand">MUI / PERFORMANCE</div><div class="tag">NATIVE SOUND · LIVE CAPTURE</div><h1 id="name">Instrument</h1><div id="notes">Ready.</div><div id="caption">Hear the instrument.<br>See the signal.</div><div id="stage"></div><div class="scope-label">OUTPUT OSCILLOSCOPE</div><div id="time">0.0 s</div><canvas id="scope" width="1776" height="150"></canvas><div class="line"></div></div>
<audio id="native-audio" class="clip" src="assets/audio.wav" data-start="0" data-duration="__DURATION__" data-track-index="1"></audio>
<script type="module">
import take from './assets/take.mjs';import{mountLayers}from'./assets/layers.mjs';
const $=id=>document.getElementById(id),scenes=new Map(),textures={},decodedImages=[];$('name').textContent=take.plugin.name;
for(const event of take.events.filter(e=>e.type==='scene')){
 scenes.set(event.revision,event.scene);
 for(const layer of event.scene.layers){const key=layer.src.length===68?layer.src:`${event.revision}/${layer.src}`;if(textures[key])continue;const img=new Image();const url=new URL(layer.src.length===68?`assets/textures/${layer.src}`:`assets/scene-${event.revision}/${layer.src}`,document.baseURI);const response=await fetch(url);if(!response.ok)throw Error(`Missing native texture: ${url}`);img.src=URL.createObjectURL(await response.blob());await img.decode();decodedImages.push(img);textures[key]=img.src;}
}
const rig=document.createElement('div');rig.className='rig';$('stage').append(rig);let capture=null,shown=null;
await document.fonts.ready;
const noteNames=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function draw(t){const frame=take.start+Math.round(t*48000);let revision=null,notes=[],pose={explode:0,angle:0,poses:{}};
 for(const e of take.events){if(e.frame>frame)break;if(e.type==='scene')revision=e.revision;if(e.type==='note')notes=e.active;if(e.type==='pose')pose=e.pose;}
 const scene=scenes.get(revision);
 if(scene){
   if(shown!==revision){const resolved=Object.fromEntries(scene.layers.map(l=>[l.src,textures[l.src.length===68?l.src:`${revision}/${l.src}`]]));const base=new URL(`assets/scene-${revision}/`,document.baseURI);
     if(!capture?.update(scene,base,resolved)){capture?.destroy();capture=mountLayers(rig,scene,base,resolved,true);}shown=revision;
   }
   const fit=Math.min(1390/scene.width,670/scene.height)*(1-.25*pose.explode);rig.style.width=scene.width+'px';rig.style.height=scene.height+'px';rig.style.left=((1390-scene.width*fit)/2)+'px';rig.style.top=((670-scene.height*fit)/2)+'px';rig.style.transformOrigin='0 0';rig.style.transform=`scale(${fit})`;capture.world.style.transform=`rotateX(${pose.explode*26}deg) rotateY(${pose.angle}deg)`;
   [...capture.layers.keys()].forEach((part,i)=>{const p=pose.poses[part]||{};for(const plane of capture.layers.get(part)){plane.style.outline=pose.highlight===part?'3px solid #f58b45':'';plane.style.filter=pose.highlight&&pose.highlight!==part?'brightness(.5)':'';}capture.setPose(part,{...p,z:(p.z||0)+(part==='background'?0:pose.explode*(70+i*40)),x:(p.x||0)+(part==='background'?0:pose.explode*(i%2?25:-25))});});
 }
 $('notes').textContent=notes.length?notes.map(n=>noteNames[n%12]+(Math.floor(n/12)-1)).join(' + '):'Release.';$('time').textContent=t.toFixed(1)+' s';
 const canvas=$('scope'),ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.fillStyle='#202320';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#4c5549';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();ctx.strokeStyle='#69dbc4';ctx.lineWidth=2;ctx.beginPath();const scope=take.scopes[Math.min(take.scopes.length-1,Math.floor(t*30))];scope.forEach((v,i)=>{const x=i/(scope.length-1)*w,y=h/2-v/32767*h*.44;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
}
const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:take.duration,duration:take.duration,ease:'none',onUpdate:()=>draw(clock.t)},0);draw(0);window.__timelines=window.__timelines||{};window.__timelines['mui-performance']=tl;
// A standalone take link is also playable without Studio; the visible browser
// audio control owns time here. HyperFrames supplies its own media clock.
if(!window.__hyperframes){const fit=()=>{const film=$('film');film.style.width='1920px';film.style.height='1080px';film.style.transformOrigin='0 0';film.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-65)/1080)})`;};fit();window.addEventListener('resize',fit);const audio=$('native-audio');audio.controls=true;audio.style.cssText='position:fixed;left:12px;bottom:12px;width:250px;z-index:99';audio.onplay=()=>tl.play(audio.currentTime);audio.onpause=()=>tl.pause(audio.currentTime);audio.onseeking=()=>tl.seek(audio.currentTime,false);audio.ontimeupdate=()=>{if(Math.abs(clock.t-audio.currentTime)>.05)tl.seek(audio.currentTime,false);};}
</script></body></html>

# Generated by tools/mirror_manifests.py from the monorepo's root Cargo.toml: this
# mirror's standalone workspace. copybara exports it as Cargo.toml. Edit the root, not this.

[workspace]
resolver = "3"
members = [
    "crates/mui",
    "crates/mui-access",
    "crates/mui-baseview",
    "crates/mui-geometry",
    "crates/mui-hal",
    "crates/mui-headless",
    "crates/mui-input",
    "crates/mui-layout",
    "crates/mui-material",
    "crates/mui-motion",
    "crates/mui-native-dialog",
    "crates/mui-playground",
    "crates/mui-present",
    "crates/mui-preview",
    "crates/mui-scene",
    "crates/mui-shaders",
    "crates/mui-style",
    "crates/mui-symbols",
    "crates/mui-text",
    "crates/mui-vello",
    "crates/mui-weld",
]
exclude = [
    "media",
    "media/mui-cut/tests/fixtures/moose",
    "media/mui-cut/tests/fixtures/moose-tone",
    "media/mui-cut/tests/fixtures/nice",
    "media/mui-cut/tests/fixtures/nice-own",
    "media/mui-cut/tests/fixtures/nice-private",
    "media/mui-cut/tests/fixtures/nice-tone",
    "media/mui-cut/tests/fixtures/patched",
    "media/mui-cut/tests/fixtures/plain",
    "media/mui-cut/tests/fixtures/plain-bare",
    "tools/ci/fixtures/accesskit-images",
    "tools/ci/fixtures/accesskit-unix-images",
    "tools/gpui-host-probe",
    "tools/mui-migrate",
    "tools/renderer-bench",
    "vendor/accesskit_macos",
    "vendor/accesskit_unix",
    "vendor/glifo",
    "vendor/moose-baseview",
    "vendor/vello_cpu",
    "vendor/xim-rs",
]

[workspace.dependencies]
color = { version = "0.3" }
epaint_default_fonts = { version = "0.36" }
i_overlay = { version = "8.1" }
kurbo = { version = "0.13.1" }
mui-access = { path = "crates/mui-access" }
mui-geometry = { path = "crates/mui-geometry" }
mui-hal = { path = "crates/mui-hal" }
mui-input = { path = "crates/mui-input" }
mui-layout = { path = "crates/mui-layout" }
mui-material = { path = "crates/mui-material" }
mui-motion = { path = "crates/mui-motion" }
mui-present = { path = "crates/mui-present" }
mui-scene = { path = "crates/mui-scene" }
mui-shaders = { path = "crates/mui-shaders" }
mui-style = { path = "crates/mui-style" }
mui-symbols = { path = "crates/mui-symbols" }
mui-text = { path = "crates/mui-text" }
mui-weld = { path = "crates/mui-weld" }
png = { version = "0.18" }
pollster = { version = "0.4" }
rustc-hash = { version = "2" }
ttf-inter = { version = "0.1", default-features = false, features = ["v"] }
unicode-segmentation = { version = "1.13" }
vello_cpu = { version = "0.3", path = "vendor/vello_cpu", default-features = false, features = ["std", "u8_pipeline", "text", "png"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package."mui"]
debug = 2


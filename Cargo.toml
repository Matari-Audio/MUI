debug = 2

[profile.dev.package."mui-material"]
debug = 2

[profile.dev.package."mui-motion"]
debug = 2

[profile.dev.package."mui-native-dialog"]
debug = 2

[profile.dev.package."mui-playground"]
debug = 2

[profile.dev.package."mui-present"]
debug = 2

[profile.dev.package."mui-preview"]
debug = 2

[profile.dev.package."mui-scene"]
debug = 2

[profile.dev.package."mui-shaders"]
debug = 2

[profile.dev.package."mui-style"]
debug = 2

[profile.dev.package."mui-symbols"]
debug = 2

[profile.dev.package."mui-text"]
debug = 2

[profile.dev.package."mui-vello"]
debug = 2

[profile.dev.package."mui-weld"]
debug = 2

[profile.release]
lto = "thin"
strip = "symbols"
panic = "unwind"

[profile.release.package."mui"]
opt-level = "s"
codegen-units = 1


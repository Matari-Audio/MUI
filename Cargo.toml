[workspace]
members = [
  "crates/mui-geometry",
  "crates/mui-style",
  "crates/mui-motion",
  "crates/mui-layout",
  "crates/mui-tessellate",
  "crates/mui-egui",
  "crates/mui-scene",
  "crates/mui-widgets",
  "crates/mui",
  "crates/mui-preview",
  "crates/mui-text",
  "crates/mui-vello",
  "crates/mui-truce",
  "crates/mui-input",
  "crates/mui-access",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
i_overlay = "=8.1.0"
egui = { version = "=0.36.2", default-features = false }
lyon_tessellation = "=1.0.20"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# A dev build of this workspace is a GUI that has to hold 60 fps while you drag a
# slider. Unoptimised dependencies cost ~25x: measured 8.4 ms per frame just to
# re-shape the preview sidebar's labels, against 0.34 ms optimised. Dependencies
# are compiled once, so this buys frame rate without costing incremental builds.
[profile.dev.package."*"]
opt-level = 3

# Our own crates keep debug codegen but at -O1: still fast to rebuild, and the
# geometry inner loops stop being a slideshow.
[profile.dev]
opt-level = 1

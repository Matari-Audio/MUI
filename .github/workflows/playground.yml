name: Playground
on:
  push:
    branches: [main]
    paths: [crates/**, playground/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/playground.yml]
  pull_request:
    paths: [crates/**, playground/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/playground.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playground-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain and the wasm target.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test expression interpreter and examples
        run: cargo test -p mui-playground --locked
      - name: Install matching WASM bindings generator
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Build browser module
        run: ./playground/build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playground
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

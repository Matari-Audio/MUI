name: Renderer measurements

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/renderer-bench/**
      - .github/workflows/renderer-bench.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MUI_REPORTING_DISABLED: "1"
  WGPU_BACKEND: vulkan
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  draw:
    name: Completed pixels / ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [core, gpui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Software Vulkan and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools libfontconfig1-dev libclang-dev libssl-dev libzstd-dev libxcb1-dev libxkbcommon-dev libwayland-dev
          icd=$(dpkg -L mesa-vulkan-drivers | sed -n '/\/lvp_icd[^/]*\.json$/p' | head -n 1)
          test -f "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          mkdir -p renderer-results
          uname -a > renderer-results/host.txt
          lscpu >> renderer-results/host.txt
          free -m >> renderer-results/host.txt
          git rev-parse HEAD >> renderer-results/host.txt
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/renderer-bench -> target
          key: renderer-${{ matrix.engine }}
      - name: Build isolated measurement binary
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          rustc -Vv >> renderer-results/host.txt
          vulkaninfo --summary > renderer-results/vulkan.txt 2>&1
          features=()
          if [ "$ENGINE" = gpui ]; then features=(--features gpui); fi
          cargo build --release --manifest-path tools/renderer-bench/Cargo.toml "${features[@]}" 2>&1 | tee renderer-results/build.log
          cp tools/renderer-bench/Cargo.lock renderer-results/Cargo.lock
          cp tools/renderer-bench/target/release/mui-renderer-bench renderer-results/mui-renderer-bench
      - name: Measure each engine in a fresh process
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          engines=(classic vello-gpu vello-cpu skia-cpu)
          if [ "$ENGINE" = gpui ]; then engines=(gpui); fi
          failed=0
          for engine in "${engines[@]}"; do
            for workload in controls vectors; do
              for scale in 1 2; do
                output="renderer-results/$engine-$workload-$scale"
                mkdir -p "$output"
                if ! python3 tools/ci/ui.py --timeout 300 --output "$output/process" -- \
                  tools/renderer-bench/target/release/mui-renderer-bench "$engine" "$workload" "$scale" "$output"; then failed=1; fi
              done
            done
          done
          exit "$failed"
      - name: Preserve measurements, lockfile, binary, pixels and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-${{ matrix.engine }}
          path: renderer-results/
          retention-days: 7
          if-no-files-found: error

  mui-pipeline:
    name: Existing MUI editor pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools libfontconfig1-dev
          icd=$(dpkg -L mesa-vulkan-drivers | sed -n '/\/lvp_icd[^/]*\.json$/p' | head -n 1)
          test -f "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          mkdir -p renderer-results
          lscpu > renderer-results/host.txt
          git rev-parse HEAD >> renderer-results/host.txt
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: renderer-mui-pipeline
      - name: Build existing benchmark
        run: cargo build --profile perf -p mui-vello --example bench --features cpu,gpu-effects --locked 2>&1 | tee renderer-results/build.log
      - name: Full editor and vector-heavy editor
        run: |
          for scene in editor vectors; do
            MUI_BENCH_SCENE="$scene" python3 tools/ci/ui.py --timeout 600 --output "renderer-results/$scene" -- target/perf/examples/bench
            grep -q '^GpuRenderer' "renderer-results/$scene/stdout.log"
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-mui-pipeline
          path: renderer-results/
          retention-days: 7
          if-no-files-found: error

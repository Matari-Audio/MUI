name: Renderer measurements

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/renderer-bench/**
      - tools/gpui-host-probe/**
      - crates/mui-preview/src/scenes.rs
      - crates/mui-material/tests/material_welding.rs
      - .github/workflows/renderer-bench.yml
      - crates/mui-vello/**
      - vendor/vello*/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  push:
    branches: [main]
    paths:
      - tools/renderer-bench/**
      - tools/gpui-host-probe/**
      - crates/mui-preview/src/scenes.rs
      - crates/mui-material/tests/material_welding.rs
      - .github/workflows/renderer-bench.yml
      - crates/mui-vello/**
      - vendor/vello*/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MUI_REPORTING_DISABLED: "1"
  WGPU_BACKEND: vulkan
  LIBGL_ALWAYS_SOFTWARE: "1"
  RUST_BACKTRACE: "1"
  RUST_LOG: gpui_wgpu=info,wgpu_core=warn

jobs:
  draw:
    name: Completed pixels / ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [classic, vello-gpu, vello-cpu, skia-cpu, gpui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Software Vulkan and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools libfontconfig1-dev libclang-dev libssl-dev libzstd-dev libxcb1-dev libxkbcommon-dev libwayland-dev gdb
          icd=$(dpkg -L mesa-vulkan-drivers | sed -n '/\/lvp_icd[^/]*\.json$/p' | head -n 1)
          test -f "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          mkdir -p renderer-results
          uname -a > renderer-results/host.txt
          lscpu >> renderer-results/host.txt
          free -m >> renderer-results/host.txt
          git rev-parse HEAD >> renderer-results/host.txt
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/renderer-bench -> target
          key: renderer-${{ matrix.engine }}
      - name: Build isolated measurement binary
        id: build
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          rustc -Vv >> renderer-results/host.txt
          vulkaninfo --summary > renderer-results/vulkan.txt 2>&1
          cargo build --release --manifest-path tools/renderer-bench/Cargo.toml --no-default-features --features "$ENGINE" 2>&1 | tee renderer-results/build.log
          cp tools/renderer-bench/Cargo.lock renderer-results/Cargo.lock
          cp tools/renderer-bench/target/release/mui-renderer-bench renderer-results/mui-renderer-bench
      - name: Measure each engine in a fresh process
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          failed=0
          for workload in controls vectors; do
            for scale in 1 2; do
              output="renderer-results/$ENGINE-$workload-$scale"
              mkdir -p "$output"
              if ! python3 tools/ci/ui.py --timeout 300 --output "$output/process" -- \
                tools/renderer-bench/target/release/mui-renderer-bench "$ENGINE" "$workload" "$scale" "$output"; then
                failed=1
                if python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); sys.exit(0 if r.get("signal") in {"SIGSEGV","SIGABRT","SIGBUS","SIGILL","SIGFPE"} else 1)' "$output/process/result.json"; then
                  # Diagnostic replay does not replace failed timing evidence.
                  python3 tools/ci/ui.py --timeout 120 --output "$output/debugger/process" -- \
                    gdb --nx --batch --return-child-result -ex run -ex 'thread apply all bt' --args \
                    tools/renderer-bench/target/release/mui-renderer-bench "$ENGINE" "$workload" "$scale" "$output/debugger" || true
                fi
              fi
            done
          done
          exit "$failed"
      - name: Evidence report self-check
        if: always()
        run: python3 -m unittest discover -s tools/renderer-bench -p test_report.py -v
      - name: Show every case, including failures and runs that never started
        if: always()
        env:
          ENGINE: ${{ matrix.engine }}
          BUILD_STATUS: ${{ steps.build.outcome }}
        run: python3 tools/renderer-bench/report.py renderer-results "$ENGINE" "$BUILD_STATUS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements, lockfile, binary, pixels and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-${{ matrix.engine }}
          path: renderer-results/
          retention-days: 7
          if-no-files-found: error

  compare:
    name: Same-host renderer comparison
    needs: draw
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: renderer-*
          path: binaries
      - name: One host and one software Vulkan driver for all candidates
        run: |
          mkdir -p renderer-comparison
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools libfontconfig1
          icd=$(dpkg -L mesa-vulkan-drivers | sed -n '/\/lvp_icd[^/]*\.json$/p' | head -n 1)
          test -f "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          lscpu > renderer-comparison/host.txt
          free -m >> renderer-comparison/host.txt
          git rev-parse HEAD >> renderer-comparison/host.txt
      - name: Sequential measurements; no compilation
        if: always()
        run: |
          failed=0
          for engine in classic vello-gpu vello-cpu skia-cpu gpui; do
            binary="binaries/renderer-$engine/mui-renderer-bench"
            build_status=failure
            if [ -f "$binary" ]; then
              chmod +x "$binary"
              build_status=success
              for workload in controls vectors; do
                for scale in 1 2; do
                  output="renderer-comparison/$engine/$engine-$workload-$scale"
                  if ! python3 tools/ci/ui.py --timeout 300 --output "$output/process" -- \
                    "$binary" "$engine" "$workload" "$scale" "$output"; then failed=1; fi
                done
              done
            fi
            if ! python3 tools/renderer-bench/report.py "renderer-comparison/$engine" "$engine" "$build_status" >> "$GITHUB_STEP_SUMMARY"; then failed=1; fi
          done
          exit "$failed"
      - name: Preserve comparable results after any failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-comparison
          path: renderer-comparison/
          retention-days: 7
          if-no-files-found: error

  mui-pipeline:
    name: Existing MUI editor pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools libfontconfig1-dev
          icd=$(dpkg -L mesa-vulkan-drivers | sed -n '/\/lvp_icd[^/]*\.json$/p' | head -n 1)
          test -f "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          mkdir -p renderer-results
          lscpu > renderer-results/host.txt
          git rev-parse HEAD >> renderer-results/host.txt
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: renderer-mui-pipeline
      - name: Build existing benchmark
        run: cargo build --profile perf -p mui-vello --example bench --features cpu,gpu-effects --locked 2>&1 | tee renderer-results/build.log
      - name: Full editor and vector-heavy editor
        run: |
          for scene in editor vectors; do
            MUI_BENCH_SCENE="$scene" python3 tools/ci/ui.py --timeout 600 --output "renderer-results/$scene" -- target/perf/examples/bench
            grep -q '^GpuRenderer' "renderer-results/$scene/stdout.log"
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-mui-pipeline
          path: renderer-results/
          retention-days: 7
          if-no-files-found: error

  native-gpui:
    name: Native GPUI CPU image bridge / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      WINIT_UNIX_BACKEND: x11
      MUI_REPORTING_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux native display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-render0-dev libxcb-randr0-dev libxcb-xkb-dev libxcb-sync-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev \
            libclang-dev libssl-dev libzstd-dev mesa-vulkan-drivers vulkan-tools mesa-utils \
            xvfb xauth dbus-x11 xdotool imagemagick python3-pil
          icd=$(dpkg -L mesa-vulkan-drivers | sed -n '/\/lvp_icd[^/]*\.json$/p' | head -n 1)
          test -f "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/gpui-host-probe -> target
          key: gpui-native-${{ runner.os }}
      - name: Build pinned native GPUI prototype and test image seam
        shell: bash
        run: |
          mkdir -p gpui-results
          cargo test --manifest-path tools/gpui-host-probe/Cargo.toml --locked 2>&1 | tee gpui-results/tests.log
          cargo build --release --manifest-path tools/gpui-host-probe/Cargo.toml --locked 2>&1 | tee gpui-results/build.log
          cp tools/gpui-host-probe/Cargo.lock gpui-results/Cargo.lock
      - name: Native fixture, input, image reuse, resize and teardown
        shell: bash
        run: |
          binary=tools/gpui-host-probe/target/release/mui-gpui-host-probe
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          failed=0
          for scene in editor effects material; do
            output="gpui-results/$scene"
            if [[ "$RUNNER_OS" == Linux ]]; then
              if ! xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
                python3 tools/ci/ui.py --output "$output" --gpui --capture --timeout 90 -- "$binary" "--test-ui=$scene"; then failed=1; fi
            else
              if ! python3 tools/ci/ui.py --output "$output" --gpui --timeout 90 -- "$binary" "--test-ui=$scene"; then failed=1; fi
            fi
          done
          exit "$failed"
      - name: Preserve prototype evidence after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-gpui-${{ matrix.os }}
          path: gpui-results/
          retention-days: 7
          if-no-files-found: error

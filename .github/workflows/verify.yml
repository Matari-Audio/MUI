name: Verify
# PRs get the full gate on Linux, as parallel jobs. Windows and macOS (wgpu
# backends, baseview embedding, truce wrappers) build and test only after a
# merge to main, from the merge queue, on demand, or on a PR labelled
# `ci:all-platforms`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:
  # `gh workflow run verify.yml --ref <branch> [-f platforms=false]`
  workflow_dispatch:
    inputs:
      platforms:
        description: Also build and test on Windows and macOS
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  # A label run gets its own group so it never cancels the code run it rides beside.
  group: verify-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  # tools/verify.sh in four parallel sections, each with its own cache.
  gate:
    if: github.event.action != 'labeled'
    strategy:
      fail-fast: false
      matrix:
        section: [root-lint, root-test, media-lint, media-test]
    name: ${{ matrix.section }}
    runs-on: ubuntu-latest
    # media-test builds plugin adapters, one with all of mui-cut in it (the
    # in-process path): uncached on a pull request, that alone is ~20 min.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-xkb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-sync-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig1-dev libclang-dev libssl-dev libzstd-dev \
            $GPU
        env:
          # Test sections get lavapipe, a software Vulkan device, so the wgpu
          # tests run instead of skipping for want of an adapter.
          GPU: ${{ endsWith(matrix.section, '-test') && 'mesa-vulkan-drivers vulkan-tools libegl1 libegl-mesa0 libgl1-mesa-dri xvfb xauth' || '' }}
      - if: endsWith(matrix.section, '-test')
        name: Vulkan device
        run: |
          vulkaninfo --summary
          vulkaninfo 2>/dev/null | grep -E 'VK_KHR_(ray_query|acceleration_structure)' || echo 'no VK_KHR_ray_query on this lavapipe'
      # rust-toolchain.toml pins the toolchain, rustfmt, clippy and the wasm target.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.section }}
          # media/ is its own workspace with its own target dir.
          workspaces: ${{ startsWith(matrix.section, 'media') && 'media -> target' || '. -> target' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # mui-cut's sound tests build plugin adapters (moose, truce, nice-plug)
      # into their own target dir, which rust-cache prunes: kept here.
      - if: matrix.section == 'media-test'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: media/target/tmp/adapters/target
          key: mui-cut-adapters-${{ hashFiles('Cargo.lock', 'media/Cargo.lock', 'media/mui-cut/tests/fixtures/**') }}
          restore-keys: mui-cut-adapters-
      - if: startsWith(matrix.section, 'root')
        run: cargo fetch --locked
      # verify.sh runs media/ offline too, against its own lock.
      - if: startsWith(matrix.section, 'media')
        run: cargo fetch --manifest-path media/Cargo.toml
      # The same gate as local, one section of it.
      - run: ./tools/verify.sh ${{ matrix.section }}
      - if: matrix.section == 'root-test'
        name: Native EGL presentation and reopen
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 WGPU_BACKEND=gl cargo test -p mui-baseview native_surface_presents_and_reopens --locked --offline -- --ignored
      # A failing test leaves the adapter builds good.
      - if: "!cancelled() && matrix.section == 'media-test' && github.ref == 'refs/heads/main'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: media/target/tmp/adapters/target
          key: mui-cut-adapters-${{ hashFiles('Cargo.lock', 'media/Cargo.lock', 'media/mui-cut/tests/fixtures/**') }}

  # The one check to require: green only when every section is.
  linux:
    if: always() && github.event.action != 'labeled'
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = success

  platforms:
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch') ||
      (github.event_name == 'workflow_dispatch' && inputs.platforms) ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:all-platforms') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci:all-platforms'))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # fmt, clippy and wasm are platform-independent and already gated on Linux.
      # Windows runners have only WARP, and wgpu's DX12 backend faults on it
      # (Device::destroy, the effects smoke test). GPU tests read WGPU_BACKEND:
      # `metal` has no adapter on Windows, so they skip; macOS keeps Metal.
      - if: runner.os == 'Windows'
        run: cargo test --workspace --all-features --locked
        env:
          WGPU_BACKEND: metal
      - if: runner.os != 'Windows'
        run: cargo test --workspace --all-features --locked

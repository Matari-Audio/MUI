name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/mui-ts/package-lock.json
      - run: rustup show
      - run: cargo fetch --locked
      - run: npm --prefix packages/mui-ts ci
      - run: ./tools/verify.sh

name: MUI UI

# Called by Verify on every PR update, main push, merge queue and manual run.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MUI_BUILD_REVISION: ${{ github.sha }}
  MUI_REPORTING_DISABLED: "1"

jobs:
  display:
    name: Gallery and native lifecycle / ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan, gl]
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      WINIT_UNIX_BACKEND: x11
      WINIT_X11_SCALE_FACTOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Display and development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-xkb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-sync-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig1-dev libclang-dev libssl-dev \
            libzstd-dev mesa-vulkan-drivers libegl1 libegl-mesa0 libgl1-mesa-dri \
            mesa-utils vulkan-tools xvfb xauth dbus-x11 ffmpeg imagemagick xdotool python3-pil ripgrep weston
          icd=$(dpkg -L mesa-vulkan-drivers | rg '/lvp_icd[^/]*\.json$' | head -n 1)
          test -f "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ui-${{ matrix.backend }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Evidence collector self-check
        run: /usr/bin/python3 -m unittest discover -s tools/ci -p test_ui.py -v
      - name: Build tester
        shell: bash
        run: |
          mkdir -p ui-results
          cargo build -p mui-preview --bin mui-preview --locked 2>&1 | tee ui-results/build.log
          cargo build -p mui-baseview --example native_editor --locked
          cargo build -p mui-winit --example native_windows --locked
      - name: Production embedded editor lifecycle
        run: |
          xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
            /usr/bin/python3 tools/ci/ui.py --output ui-results/embedded --timeout 60 -- \
            target/debug/examples/native_editor
      - name: All gallery scenes, themes, sizes, input and visible pixels
        run: |
          xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
            /usr/bin/python3 tools/ci/ui.py --output ui-results/gallery \
            --gallery --renderer gpu --record -- target/debug/mui-preview --test-ui
      - name: Embedded editor pixels, accessibility, expose, close and reopen
        if: ${{ !cancelled() }}
        run: |
          xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
            /usr/bin/python3 tools/ci/ui.py --output ui-results/baseview -- \
            cargo test -p mui-baseview --lib --locked -- --ignored --test-threads=1
          rg -q 'native_resize_failure_falls_back_and_presents .*ok' ui-results/baseview/stdout.log
      - name: Multiwindow resize and close
        if: ${{ !cancelled() }}
        run: |
          xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
            /usr/bin/python3 tools/ci/ui.py --output ui-results/windows -- \
            cargo test -p mui-winit --test native_windows --locked -- --ignored --test-threads=1
      - name: Device loss and incomplete surface replacement
        if: ${{ !cancelled() }}
        run: |
          xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
            /usr/bin/python3 tools/ci/ui.py --output ui-results/device-loss -- \
            cargo test -p mui-vello --lib --features gpu-effects --locked host::tests -- --ignored --test-threads=1
          rg -q 'a_destroyed_device_is_seen_and_a_new_one_renders .*ok' ui-results/device-loss/stdout.log
          rg -q 'a_failed_replacement_state_requires_a_surface_before_presenting .*ok' ui-results/device-loss/stdout.log
      - name: CPU fallback when every GPU backend is unavailable
        if: ${{ !cancelled() && matrix.backend == 'vulkan' }}
        env:
          WGPU_BACKEND: metal
        run: |
          xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
            /usr/bin/python3 tools/ci/ui.py --output ui-results/cpu -- \
            cargo test -p mui-baseview --lib --locked native_cpu_fallback_presents_and_reopens -- --ignored --test-threads=1
          rg -q 'native_cpu_fallback_presents_and_reopens .*ok' ui-results/cpu/stdout.log
          MUI_EXPECT_SOFTWARE=1 xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
            /usr/bin/python3 tools/ci/ui.py --output ui-results/embedded-cpu --timeout 60 -- \
            target/debug/examples/native_editor
          rg -q 'GPU unavailable.*using CPU rendering' ui-results/embedded-cpu/stderr.log
          xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
            /usr/bin/python3 tools/ci/ui.py --output ui-results/standalone-automatic-cpu --gallery --renderer cpu -- \
            target/debug/mui-preview --test-ui
      - name: Required standalone CPU gallery and multiwindow lifecycle
        if: ${{ !cancelled() && matrix.backend == 'vulkan' }}
        env:
          MUI_RENDERER: cpu
        run: |
          xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
            /usr/bin/python3 tools/ci/ui.py --output ui-results/standalone-cpu --gallery --renderer cpu -- \
            target/debug/mui-preview --test-ui
          xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- \
            /usr/bin/python3 tools/ci/ui.py --output ui-results/windows-cpu --renderer cpu --timeout 60 -- \
            target/debug/examples/native_windows
      - name: Standalone Wayland presentation, resize and two-window teardown
        if: ${{ !cancelled() && matrix.backend == 'vulkan' }}
        shell: bash
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/mui-wayland"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/mui-wayland"
          export WAYLAND_DISPLAY=wayland-mui
          export WINIT_UNIX_BACKEND=wayland
          unset DISPLAY
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            --width=1600 --height=1200 --log="$GITHUB_WORKSPACE/ui-results/weston.log" &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true; wait "$compositor" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            test ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || break
            kill -0 "$compositor"
            sleep .1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          /usr/bin/python3 tools/ci/ui.py --output ui-results/wayland --timeout 60 -- \
            target/debug/examples/native_windows
      - name: Retain evidence even after a native fault
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mui-ui-linux-${{ matrix.backend }}
          path: ui-results/
          if-no-files-found: warn
          retention-days: 7

  embedded:
    name: Required embedded CPU lifecycle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            unavailable: metal
          - os: macos-15
            unavailable: dx12
    env:
      MUI_EXPECT_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ui-embedded-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build production embedded tester
        shell: bash
        run: |
          mkdir -p ui-results
          cargo build -p mui-baseview --example native_editor --locked 2>&1 | tee ui-results/build.log
          cargo build -p mui-preview --bin mui-preview --locked
          cargo build -p mui-winit --example native_windows --locked
      - name: Required standalone CPU gallery, resize and two-window teardown
        shell: bash
        env:
          MUI_RENDERER: cpu
        run: |
          python3 tools/ci/ui.py --output ui-results/standalone-cpu --gallery --renderer cpu -- target/debug/mui-preview --test-ui
          python3 tools/ci/ui.py --output ui-results/windows-cpu --renderer cpu --timeout 60 -- target/debug/examples/native_windows
      - name: Explicit CPU selection, resize, close and reopen
        shell: bash
        env:
          MUI_RENDERER: cpu
        run: |
          python3 tools/ci/ui.py --output ui-results/explicit-cpu --timeout 60 -- target/debug/examples/native_editor
      - name: Automatic CPU fallback after GPU initialization failure
        if: ${{ !cancelled() }}
        shell: bash
        env:
          WGPU_BACKEND: ${{ matrix.unavailable }}
        run: |
          python3 tools/ci/ui.py --output ui-results/automatic-cpu --timeout 60 -- target/debug/examples/native_editor
          grep -q 'GPU unavailable.*using CPU rendering' ui-results/automatic-cpu/stderr.log
          python3 tools/ci/ui.py --output ui-results/standalone-automatic-cpu --gallery --renderer cpu -- target/debug/mui-preview --test-ui
      - name: Actual WARP adapter is rejected safely and the editor presents
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        env:
          WGPU_BACKEND: dx12
        run: |
          python3 tools/ci/ui.py --output ui-results/warp-cpu --timeout 60 -- target/debug/examples/native_editor
          grep -q 'WARP compute shader compilation can crash' ui-results/warp-cpu/stderr.log
      - name: Retain editor lifecycle and fallback evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mui-ui-embedded-${{ matrix.os }}
          path: ui-results/
          if-no-files-found: warn
          retention-days: 7

  native-probe:
    # Standard VMs do not promise an accelerated adapter. Preserve a failed
    # probe as failed evidence; embedded CPU lifecycle is required separately.
    name: Native GPU probe / ${{ matrix.os }} / ${{ matrix.backend }}
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            backend: dx12
          - os: macos-15
            backend: metal
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ui-native-${{ matrix.backend }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tester
        shell: bash
        run: |
          mkdir -p ui-results
          cargo build -p mui-preview --bin mui-preview --locked 2>&1 | tee ui-results/build.log
          cargo build -p mui-baseview --example native_editor --locked
          cargo build -p mui-winit --example native_windows --locked
      - name: Collect Windows native fault stacks for the tester
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumps = Join-Path $env:GITHUB_WORKSPACE 'ui-results/native/dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\mui-preview.exe'
          New-Item -Force -Path $key | Out-Null
          New-ItemProperty -Force -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumps | Out-Null
          New-ItemProperty -Force -Path $key -Name DumpType -PropertyType DWord -Value 1 | Out-Null
          New-ItemProperty -Force -Path $key -Name DumpCount -PropertyType DWord -Value 3 | Out-Null
      - name: Actual native presentation, with crash exit status
        id: native_probe
        shell: bash
        run: |
          python3 tools/ci/ui.py --output ui-results/native --gallery --renderer gpu -- target/debug/mui-preview --test-ui
      - name: Native GPU embedded editor lifecycle
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 tools/ci/ui.py --output ui-results/embedded-gpu --timeout 60 -- target/debug/examples/native_editor
      - name: Native GPU multiwindow resize and teardown
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 tools/ci/ui.py --output ui-results/multiwindow-gpu --renderer gpu --timeout 60 -- target/debug/examples/native_windows
      - name: Replay Windows fault under CDB
        if: always() && runner.os == 'Windows' && steps.native_probe.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $diagnostic = Join-Path $env:GITHUB_WORKSPACE 'ui-results/native-debug'
          $symbols = Join-Path $diagnostic 'symbols'
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Debuggers/x64/cdb.exe'
          if (!(Test-Path $cdb)) {
            throw "Windows SDK CDB is unavailable at $cdb; original probe result is preserved"
          }
          Copy-Item 'target/debug/mui-preview.exe' $symbols
          Get-ChildItem 'target/debug' -Filter '*preview*.pdb' | Copy-Item -Destination $symbols
          $commands = Join-Path $diagnostic 'commands.txt'
          @'
          sxd -c2 ".dump /mA ui-results/native-debug/crash.dmp; .exr -1; .ecxr; r; kv; ~* kv; lm; q" av
          g
          '@ | Set-Content -Path $commands -Encoding ascii
          $symbolPath = "$symbols;srv*$env:RUNNER_TEMP/cdb-symbols*https://msdl.microsoft.com/download/symbols"
          # Keep the initial breakpoint so -cf installs the second-chance AV
          # commands before g resumes. -G exits on normal process termination;
          # -hd avoids the debugger's special heap. This is diagnostic replay,
          # not a replacement for the original status or frame measurements.
          python3 tools/ci/ui.py --output ui-results/native-debug --timeout 180 --gallery -- $cdb -G -hd -lines -y $symbolPath -cf $commands target/debug/mui-preview.exe --test-ui
      - name: State native probe outcome
        if: always()
        shell: bash
        env:
          PROBE_STATUS: ${{ job.status }}
        run: |
          echo "### $WGPU_BACKEND native probe: $PROBE_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo 'Informational VM coverage. Missing adapters and native faults fail the probe; no tests are silently skipped.' >> "$GITHUB_STEP_SUMMARY"
          if test -f ui-results/native/result.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ui-results/native/result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain adapter inventory, frame events and native exit status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mui-ui-native-${{ matrix.os }}-${{ matrix.backend }}
          path: ui-results/
          if-no-files-found: warn
          retention-days: 7

name: Framework stack tools
on:
  push:
    paths: ['tools/stack-check/**', '.github/workflows/framework-stack*.yml']
  pull_request:
    paths: ['tools/stack-check/**', '.github/workflows/framework-stack*.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/stack-check -p 'test_*.py'

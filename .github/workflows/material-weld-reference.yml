name: Material weld reference
on:
  pull_request:
    paths: [tools/material-weld-demo/**, .github/workflows/material-weld-reference.yml]
  push:
    branches: [main]
    paths: [tools/material-weld-demo/**, .github/workflows/material-weld-reference.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weld-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Reference equations and geometry properties
        run: node --test tools/material-weld-demo/engine.test.mjs
      - name: Offline HTML source parity
        run: python3 tools/material-weld-demo/build.py --check

name: Native UI qualification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ui-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MUI_REPORTING_DISABLED: '1'
  MUI_GPU_DEBUG: '1'
  MUI_TEST_ALLOW_WARP: '1'
  LIBGL_ALWAYS_SOFTWARE: '1'
  GALLIUM_DRIVER: llvmpipe
jobs:
  native:
    if: github.event.repository.private == false
    name: ${{ matrix.os }} / ${{ matrix.backend }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, backend: vulkan, compiler: default}
          - {os: windows-latest, backend: dx12, compiler: StaticDxc}
          - {os: windows-latest, backend: dx12, compiler: Fxc}
          - {os: macos-latest, backend: metal, compiler: default}
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      WGPU_DX12_COMPILER: ${{ matrix.compiler }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          cache-key: native-ui-${{ matrix.backend }}-${{ matrix.compiler }}
      - name: Build production lifecycle hosts and GPU contracts
        run: |
          mkdir -p ui-results
          exec > >(tee -a ui-results/build.log) 2>&1
          cargo build -p mui-baseview --example native_editor --features test-support --locked
          cargo build -p mui-winit --example native_windows --features mui/test-support --locked
          cargo build -p mui-preview --bin mui-preview --features mui/test-support --locked
          cargo build -p mui-vello --examples --features cpu,gpu-effects,test-support --locked
      - name: All pipelines, retained contract, CPU reference pixels and native lifecycle
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s '-screen 0 1600x1200x24' dbus-run-session -- python3 tools/ci/native_suite.py
          else
            python3 tools/ci/native_suite.py
          fi
      - name: Preserve adapter, compiler, pixel diffs and lifecycle failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ui-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.compiler }}
          path: ui-results/
          if-no-files-found: error
          retention-days: 7
